name : Python CI
# It is for Trigger on push or pull type of req
on :
    push :
        branches :
            - main
    pull_request:
        branches :
            - main 


jobs :
    test :
        runs-on : ubuntu-latest
        # check the code from repository
        steps:
            - name: Check out code
              uses : actions/checkout@v4
        
            # Set up python env
            - name : Set up Python
              uses : actions/setup-python@v5
              with :
                python-version : '3.12'
            
            # intsll dependencies
            - name : Install dependencies
              run : |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            
            # Run tests
            - name : Run tests
              run : pytest
